[preset.1.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
; NO THREADS, deliberately. A threaded web build needs the server to send
; Cross-Origin-Opener-Policy and Cross-Origin-Embedder-Policy headers, and
; without them the page fails to start at all -- which rules out itch.io, plain
; static hosting, and opening the file to check something. The cost is that
; everything runs on one core, and for an idle game whose per-frame work is a
; few hundred transforms that is the right trade.
variant/thread_support=false
; BOTH off-ish: for_mobile=true demands ETC2/ASTC, and
; rendering/textures/vram_compression/import_etc2_astc defaults to FALSE, so
; the preset failed can_export() with a "configuration errors" message that
; named nothing. This project has NO textures -- every surface is flat colour
; plus a baked vertex-colour channel -- so texture compression buys exactly
; nothing here. Turn for_mobile back on the day a texture appears, and enable
; the matching project setting in the same commit.
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"mobile-web-app-capable\" content=\"yes\"><meta name=\"apple-mobile-web-app-capable\" content=\"yes\"><meta name=\"apple-mobile-web-app-title\" content=\"Gods and Lamb\"><meta name=\"theme-color\" content=\"#0f1117\"><meta name=\"description\" content=\"A chill incremental god-game. Bless your villagers, green a desert one tile at a time, and answer the fires and droughts that take it back.\"><style>html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none}</style>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=true
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)
